<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8"/>
  <title>文本框检查器</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>

  <div class="container">

    <header>
      <span class="logo">🔍</span>
      <div>
        <h1 data-i18n="appTitle">文本框检查器</h1>
        <p class="subtitle">Text Frame Inspector · Illustrator</p>
      </div>
      <div class="lang-switch" aria-label="Language">
        <button id="lang-zh" class="lang-btn active" type="button">中</button>
        <button id="lang-en" class="lang-btn" type="button">EN</button>
      </div>
    </header>

    <nav class="tabs">
      <button id="tab-main" class="tab-btn active" type="button" data-i18n="tabMain">当前页</button>
      <button id="tab-settings" class="tab-btn" type="button" data-i18n="tabSettings">配置</button>
    </nav>

    <section id="panel-main" class="panel-view active">
      <section class="actions">
        <button id="btn-scan" class="btn btn-blue">
          <span class="btn-icon">📋</span>
          <span class="btn-body">
            <span class="btn-label" data-i18n="scanLabel">扫描所有文字</span>
            <span class="btn-hint" data-i18n="scanHint">列出全部文本框，标出风险项</span>
          </span>
        </button>

        <button id="btn-highlight" class="btn btn-orange">
          <span class="btn-icon">🟠</span>
          <span class="btn-body">
            <span class="btn-label" data-i18n="highlightAllLabel">高亮所有文本框位置</span>
            <span class="btn-hint" data-i18n="highlightAllHint">给每个文本框画定位框</span>
          </span>
        </button>

        <button id="btn-highlight-risk" class="btn btn-red">
          <span class="btn-icon">🚨</span>
          <span class="btn-body">
            <span class="btn-label" data-i18n="highlightRiskLabel">高亮所有敏感字文本框</span>
            <span class="btn-hint" data-i18n="highlightRiskHint">只标出占位文本 / 风险文本框</span>
          </span>
        </button>

        <button id="btn-restore" class="btn btn-ghost">
          <span class="btn-icon">↩</span>
          <span class="btn-body">
            <span class="btn-label" data-i18n="restoreLabel">还原 / Restore</span>
            <span class="btn-hint" data-i18n="restoreHint">移除所有临时高亮</span>
          </span>
        </button>
      </section>

      <section class="results-panel">
        <div class="results-tools">
          <div class="search-wrap">
            <input id="search-box" type="text" placeholder="搜索文字内容 / Search text…" autocomplete="off" data-i18n-placeholder="searchPlaceholder"/>
            <span class="search-count" id="search-count"></span>
          </div>
          <button id="btn-filter-risk" class="icon-action" type="button" title="只看风险项" data-i18n-title="filterRiskTitle" aria-pressed="false">
            ⚠
          </button>
        </div>

        <div class="results-header" id="results-header" style="display:none">
          <span id="results-count"></span>
          <span id="results-risk"></span>
        </div>

        <ul class="frame-list" id="frame-list"></ul>

        <div class="empty-state" id="empty-state">
          <div class="empty-icon">📄</div>
          <p data-i18n="emptyTitle">点击「扫描」开始检测</p>
          <p class="hint" data-i18n="emptyHint">Click "扫描" to start</p>
        </div>
      </section>
    </section>

    <section id="panel-settings" class="panel-view">
      <div class="settings-panel">
        <div class="settings-block">
          <div class="settings-title" data-i18n="prefixTitle">敏感词前缀</div>
          <div class="settings-hint" data-i18n="prefixHint">每行一个，文本以前缀命中即判定为占位文本</div>
          <textarea id="settings-prefixes" class="settings-textarea" spellcheck="false"></textarea>
        </div>

        <div class="settings-grid">
          <label class="field">
            <span class="field-label" data-i18n="allColor">全部框颜色</span>
            <input id="settings-all-color" type="color" value="#ffaa00"/>
          </label>

          <label class="field">
            <span class="field-label" data-i18n="riskColor">敏感框颜色</span>
            <input id="settings-risk-color" type="color" value="#ff3c3c"/>
          </label>

          <label class="field">
            <span class="field-label" data-i18n="focusColor">定位线颜色</span>
            <input id="settings-focus-color" type="color" value="#00c8ff"/>
          </label>

          <label class="field">
            <span class="field-label" data-i18n="allWidth">全部框粗细</span>
            <input id="settings-all-width" type="number" min="0.5" max="12" step="0.5" value="1"/>
          </label>

          <label class="field">
            <span class="field-label" data-i18n="riskWidth">敏感框粗细</span>
            <input id="settings-risk-width" type="number" min="0.5" max="12" step="0.5" value="2"/>
          </label>

          <label class="field">
            <span class="field-label" data-i18n="focusWidth">定位框粗细</span>
            <input id="settings-focus-width" type="number" min="0.5" max="12" step="0.5" value="2"/>
          </label>

          <label class="field">
            <span class="field-label" data-i18n="crossWidth">定位线粗细</span>
            <input id="settings-cross-width" type="number" min="0.5" max="12" step="0.5" value="1.5"/>
          </label>
        </div>

        <div class="settings-actions">
          <button id="btn-save-settings" class="btn btn-blue" type="button">
            <span class="btn-icon">💾</span>
            <span class="btn-body">
              <span class="btn-label" data-i18n="saveLabel">保存配置</span>
              <span class="btn-hint" data-i18n="saveHint">保存到本地并立即生效</span>
            </span>
          </button>
        </div>
      </div>
    </section>

    <div class="status-bar" id="status-bar" data-i18n="ready">就绪 / Ready</div>

  </div>

  <script src="js/CSInterface.js"></script>
  <script src="js/main.js"></script>

</body>
</html>
